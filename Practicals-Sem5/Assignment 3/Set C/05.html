<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="ask()">Confirm</button>
    <script>
    function ask(){
    if(confirm("Do you want to continue?"))
        alert("You chose YES");
    else
        alert("You chose NO");
    }
    </script>
</body>
</html>
